packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  typescript: 7.0.2

allowBuilds:
  esbuild: true
  sharp: true
  msw: false
  onnxruntime-node: false
  protobufjs: true

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.19'
  - '@ai-sdk/gateway@4.0.28'
  - ai@7.0.37
  - '@finografic/ai-harness@0.1.1 || 0.2.0'
  - '@finografic/project-scripts@1.6.1 || 2.0.1'
