<html>
  <head>
    <title>Everything After This Is Title Text
  <body>
    <div class="entry">
      <h1>This Heading Is Never Rendered</h1>
      <p>
        Per the HTML specification the contents of a title element are RCDATA, so a title that is
        never closed swallows the remainder of the document. Every conforming parser — browsers
        included — reports an empty body for this page, which means there is no article to extract
        and no honest way to store one.
      </p>
    </div>
  </body>
</html>
